# Site paths for the catalog designer (copy to a local, untracked file and edit).
reference_fasta: /path/to/Homo_sapiens.assembly38.fa
gtf: /path/to/gencode.v37.annotation.gtf.gz
annotation_cache: /scratch/igi/gencode.v37.tx.json.gz
exome_bed: /path/to/hg38_exome.bed
rmsk_bed: /path/to/hg38.rmsk.bed.gz
segdups_bed: /path/to/hg38.segdups.bed
arms_bed: /path/to/hg38.arms.bed
expression_tsv: catalog/resources/tcga_brca_basal.transcript_tpm.tsv.gz
germline_vcf:
  HG002: /path/to/HG002.Q100v1.1.germline_smvar.vcf.gz
  IPISRC044: /path/to/IPISRC044.germline.phased.final.vcf.gz
netmhcpan_cmd: "singularity exec -B /data /path/netmhcpan-4.1b.img /netMHCpan-4.1/Linux_x86_64/bin/netMHCpan -BA -a {alleles} -f {fasta}"
workdir: /scratch/igi/catalog_work
netmhcpan_threads: 24
cta_gene_list: /path/to/cta.gene_list
erv_loci: /path/to/curated_erv_loci.tsv
erv_all_loci: /path/to/Hsap38.txt
pan_normal_quant: /path/to/pan_normal_and_mtec_exp.95th_perc.quant.sf
art_cmd: "singularity exec -B /data /path/art.sif art_illumina {args}"
viral_fasta: /path/to/virus_unmasked.fa

# Kinnex (PacBio MAS-seq). The adapter FASTA and the array profile are fitted from a real segmented BAM by
# jobs/measure/fit_mas_adapters.py; the size-selection curve by jobs/measure/fit_kinnex_size_selection.py.
# Leave kinnex_size_selection out to sample molecules by abundance alone, which makes the library shorter
# than a real one (p10 498 bp against 1,355) rather than failing.
kinnex_adapters_fasta: /path/to/catalog/resources/kinnex_mas8_adapters.fasta
kinnex_mas_profile: /path/to/catalog/resources/kinnex_mas8_profile.json
kinnex_size_selection: /path/to/catalog/resources/kinnex_size_selection.json
skera_cmd: "singularity exec -B /mnt /path/to/pbskera_1.4.0.sif skera {args}"
# Single-cell size selection, fitted separately from bulk: the 10x 5' cDNA length distribution is both
# shorter in the median and more heavily tailed.
kinnex_sc_size_selection: /path/to/catalog/resources/kinnex_sc_size_selection.json

# ---------------------------------------------------------------------------
# Long-read simulator constants. These are MEASUREMENTS, not site specifics, so they belong in version
# control even though the paths above do not. Every identity value is the request needed to land on a
# measured target, never the target itself: Badread's realised identity is offset from the flag, the offset
# differs per model, and it is not small.
#
#   model        target accuracy   realised at face value   request
#   PacBio HiFi      0.99823            0.99908 (+0.43)      99.4
#   ONT genomic      0.98676            0.98401 (-0.49)      99.17
#   ONT cDNA         0.98220            0.98028 (-0.19)      98.41
#
# Verified end to end on chr21: ONT genomic lands at 0.98633 with length mean 19,067 and sd 15,485 against
# targets of 0.98676, 19,117 and 15,530.

# Set to Badread's FLOOR, not to a calibrated offset. Measured against the alignment, pacbio2021 has a
# hard error floor of 3.05e-3/bp (Q25.2) that --identity cannot reach past -- 100,100,0 still returns it
# -- against real Revio HiFi's 1.77e-3. The earlier "99.4,99.8,0.5 -> 0.99823" was read off the reads'
# own quality strings, which is not a measurement of a simulated read: Badread builds sequence from an
# error model and qualities from a separate qscore model, and these two disagree by 5.15x.
pacbio_identity: "100,100,0"               # -> true 0.99695 by alignment; 1.72x real HiFi error
# Multiplies each base's error probability so the quality strings stop claiming an accuracy the reads do
# not have. 5.15 is the measured true/claimed error ratio, which is constant across identity requests.
pacbio_qual_error_scale: 5.15
pacbio_length_mean: 16689
pacbio_length_sd: 4593
pacbio_error_model: pacbio2021
pacbio_qscore_model: pacbio2021

ont_identity: "98.41,99.6,1.5"            # -> 0.9822, IPISRC044 R10.4.1 SUP cDNA
ont_length_mean: 910                      # applies to ONT scRNA; see build-reference.md on the RNA caveat
ont_length_sd: 461
ont_wgs_identity: "99.17,99.6,1.5"        # -> 0.98676, ONT open data HG002 PAW70337
ont_wgs_length_mean: 19117
ont_wgs_length_sd: 15530
ont_error_model: nanopore2023
ont_qscore_model: nanopore2023

# Chunking. 20 Mb per chunk with a one-read-length overlap. Leaving a derived chromosome whole confined it
# to one core and pushed each chunk past the timeout, which cost 61 of 96 ONT WGS tasks; the timeout is a
# backstop, not a substitute for chunking small enough.
pacbio_chunk_bp: 20000000
pacbio_chunk_timeout_s: 10800

# pbindex builds the .pbi index the design calls for (pbtk >= 3.5.0). Absent from the pbskera and pbccs
# images, so it needs its own container. Leave unset to skip indexing.
pbindex_cmd: "singularity exec --no-home -B /path /path/to/pbtk_3.5.0.sif pbindex {args}"

# ONT bulk RNA is a separate length fit from the single-cell one. 910/461 above is IPISRC044 10x 5p
# single-cell cDNA: 5-prime biased and deliberately truncated, which is right for the sc assay and wrong
# for a library the design calls "cDNA, full length". Measured on 400,000 reads of the real HG002 Kinnex
# FLNC BAM, which is a genuine full-length cDNA library of the same transcriptome:
#   mean 2091  sd 843  median 1859  p10 1265  p90 3192  >=1kb 96.7%  >=2kb 42.5%
# That independently agrees with the 2224 post-skera segment mean recorded above from the same library.
ont_bulk_rna_length_mean: 2091
ont_bulk_rna_length_sd: 843
